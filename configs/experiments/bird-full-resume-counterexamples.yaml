experiment_name: bird-full-resume-counterexamples
benchmark: bird
bird_mode: full
data_root: ${BIRD_ROOT}
output_dir: outputs/bird-full
mutation_profile: canonical
workers: 32
resume: true
overwrite: false

stages:
  normalize: false
  mutate: false
  equivalence: false
  execute: false
  counterexamples: true
  augment: true
  report: true

timeouts:
  verieql_seconds: 120
  sqlite_seconds: 120
  sqldriller_seconds: 300

tools:
  verieql_path: ${VERIEQL_ROOT}
  verieql_python: ${VERIEQL_PYTHON}
  sqldriller_path: ${SQLDRILLER_ROOT}
  sqldriller_python: ${SQLDRILLER_PYTHON}
